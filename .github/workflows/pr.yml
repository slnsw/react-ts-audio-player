  vitest:
    needs: [pr-init]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      
      - name: Composite PNPM setup
        uses: ./.github/actions/pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-update: ${{ env.BUILD_UPDATE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run vitest
        run: pnpm vitest:ci
